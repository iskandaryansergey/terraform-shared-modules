  # ---------------------------------------------------------------------------
  # Own job on purpose.
  #
  # These gates previously sat as sequential steps after four unrelated modules'
  # lint steps inside `static-analysis`. GitHub Actions aborts a job at the first
  # failing step, so an untracked sibling module - or a pip resolution failure in
  # someone else's linter - silently prevented every runner gate from executing.
  # That is not hypothetical: it is how these gates went unrun for the module's
  # entire life while the job's redness read as chronic breakage.
  #
  # Separate jobs also run in parallel, so this is faster as well as honest.
  # ---------------------------------------------------------------------------
  runner-gates:
    name: GitLab Runner Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Render config.toml + the bootstrap script offline (create=false, no creds)
      # and PARSE them. terraform test can only match substrings, and a TOML key
      # under the wrong table still matches a substring - only a parser catches
      # it, and that class of bug silently disables the readiness gate.
      # Guard the CLASS of bug, not the instance: two root-RCE defects in this
      # module came from a caller string reaching a shell or a heredoc without
      # being encoded. This fails the build on any new raw interpolation.
      - name: GitLab runner (Fargate) template safety
        run: |
          python3 modules/gitlab-runner-fargate/tests/template_safety.py \
            modules/gitlab-runner-fargate/templates \
            --module-dir modules/gitlab-runner-fargate

      - name: GitLab runner (Fargate) egress complement
        run: python3 modules/gitlab-runner-fargate/tests/egress_complement.py modules/gitlab-runner-fargate

      - name: GitLab runner (Fargate) config structural lint
        run: |
          set -euo pipefail
          cd modules/gitlab-runner-fargate/tests/render
          terraform init -backend=false
          terraform apply -auto-approve
          terraform output -raw config_toml  > /tmp/fargate-config.toml
          terraform output -raw fargate_toml > /tmp/fargate-driver.toml
          cd -
          python3 modules/gitlab-runner-fargate/tests/parse_config.py \
            /tmp/fargate-config.toml /tmp/fargate-driver.toml

      # Proves the structural guard by REGRESSION rather than trusting it (R2.4).
      # Removing listen_address reproduces the defect that made the fleet
      # undeployable; the guard must reject it. A guard that is never shown to
      # fail is an assertion, not a control.
      - name: GitLab runner (Fargate) guard regression proof
        run: |
          set -euo pipefail
          grep -v '^listen_address' /tmp/fargate-config.toml > /tmp/fargate-broken.toml
          if python3 modules/gitlab-runner-fargate/tests/parse_config.py \
               /tmp/fargate-broken.toml /tmp/fargate-driver.toml; then
            echo "::error::parse_config.py accepted a config.toml with no listen_address."
            echo "::error::That is the defect that made the fleet undeployable - the manager"
            echo "::error::health check probes an endpoint gitlab-runner never starts."
            exit 1
          fi
          echo "OK: the guard rejects a config.toml missing listen_address."

      - name: GitLab runner (Fargate) entrypoint shellcheck
        run: |
          set -euo pipefail
          for f in modules/gitlab-runner-fargate/docker/*.sh; do
            sh -n "$f"
            shellcheck -S warning "$f"
          done

      - name: GitLab runner template safety
        run: python3 modules/gitlab-runner/tests/template_safety.py modules/gitlab-runner/templates

      - name: GitLab runner config structural lint
        run: |
          cd modules/gitlab-runner/tests/render
          terraform init -backend=false
          terraform apply -auto-approve
          terraform output -raw config_toml > /tmp/runner-config.toml
          terraform output -raw manager_user_data > /tmp/runner-user-data.sh
          python3 ../parse_config.py /tmp/runner-config.toml /tmp/runner-user-data.sh

      # Shell-lint the rendered bootstrap. It runs as root on the machine that
      # holds the runner token, so it gets the same scrutiny as module code.
      - name: GitLab runner bootstrap shellcheck
        run: |
          # bash -n first: a syntax error in the rendered script means every
          # manager fails to boot, and it costs nothing to check.
          bash -n /tmp/runner-user-data.sh
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning /tmp/runner-user-data.sh

      # - name: Checkov Scan
      #   uses: bridgecrewio/checkov-action@master
      #   continue-on-error: true
      #   with:
      #     directory: .
      #     framework: terraform
      #     output_format: cli
      #     soft_fail: false

      # NOTE: tflint runs per-module in the `validate` matrix, not here. A
      # repo-wide `--recursive` currently fails to build two legacy directories
      # (examples/acm-import, modules/kuber-experiemental reference nested
      # modules that no longer exist), which would gate every PR on unrelated
      # breakage. Per-module linting gates each module on its own health.
