name: "Terraform Pipeline"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  static-analysis:
    name: Security & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Runs FIRST, on purpose. Every path this workflow references must be
      # tracked in git, because an untracked path does not exist on a fresh
      # checkout: the step that uses it fails with an interpreter or `cd` error,
      # and because steps are sequential that aborts every later step in the job.
      #
      # That is not hypothetical. An untracked script plus an untracked module
      # directory each independently killed this job, so four gitlab-runner
      # quality gates never executed once in CI while the job's redness read as
      # chronic breakage rather than as a signal.
      #
      # Failing here, first, with the full list, makes that class of failure
      # comprehensible instead of mysterious.
      - name: Referenced paths are tracked in git
        run: |
          set -uo pipefail
          missing=()
          # Scripts invoked by any workflow.
          # Only scripts that are actually INVOKED, i.e. the argument to python3 or
          # python. Matching every occurrence of "*.py" produced a false positive on
          # a filename mentioned inside an error message, and a guard that cries
          # wolf is a guard someone switches off.
          #
          # Repo-root-relative paths only: a path beginning with ../ is relative to
          # some earlier `cd` in the same step and cannot be resolved from here.
          for f in $(grep -ohE 'python3?[[:space:]]+[A-Za-z0-9_./-]+\.py' .github/workflows/*.yaml \
                     | awk '{print $2}' | sort -u); do
            case "$f" in ..*|/*) continue ;; esac
            git ls-files --error-unmatch "$f" >/dev/null 2>&1 || missing+=("$f (script)")
          done
          # Directories any workflow cd's into.
          for d in $(grep -ohE '^\s*cd\s+[A-Za-z0-9_./-]+' .github/workflows/*.yaml \
                     | awk '{print $2}' | sort -u); do
            [ "$d" = "-" ] && continue
            if [ -z "$(git ls-files "$d")" ]; then
              missing+=("$d/ (directory, 0 tracked files)")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::${#missing[@]} path(s) referenced by CI are not tracked in git:"
            printf '  - %s\n' "${missing[@]}"
            echo ""
            echo "A gate that lives only in a working tree protects nothing, and it takes"
            echo "every later step in this job down with it. Either 'git add' these paths"
            echo "or remove the steps that reference them."
            exit 1
          fi
          echo "All CI-referenced scripts and directories are tracked."

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Guard against drift between the two aws_ecs_service resources (autoscaled
      # vs static) - they must stay identical except the lifecycle block.
      - name: ECS service parity check
        run: python3 modules/ecs-orchestrator/tests/service_parity.py

      # Render the agent-warden policy documents offline (create=false, no
      # creds) and lint them with parliament - catches malformed operators,
      # unknown action prefixes, and escalation paths that terraform test can't.
      - name: Agent-warden IAM policy lint
        run: |
          cd modules/agent-warden/tests/render
          terraform init -backend=false
          terraform apply -auto-approve
          terraform output -raw boundary_policy_json > /tmp/boundary.json
          terraform output -raw team_grants_policy_json > /tmp/grants.json
          terraform output -raw scp_policy_json > /tmp/scp.json
          # parliament still imports pkg_resources (removed in setuptools >= 81)
          pip install --quiet 'setuptools<81' parliament
          python3 ../lint_policies.py /tmp/boundary.json /tmp/grants.json /tmp/scp.json

      # Render the appconfig feature-flag documents offline (create=false, no
      # creds) and lint them against the AWS flag format + semantic rules
      # (enum/bounds/pattern/required) that terraform test cannot express.
      - name: AppConfig flag-format lint
        run: |
          cd modules/appconfig/tests/render
          terraform init -backend=false
          terraform apply -auto-approve
          terraform output -json feature_flags_json > /tmp/flags.json
          python3 ../lint_flags.py /tmp/flags.json

      # Prove agent-warden-2 guardrails offline: render every profile's policies
      # (create=false, no creds) and assert each prohibition resolves to an
      # unconditional explicit Deny. An untested guardrail is an absent one.
      - name: Agent-warden-2 guardrail proof
        run: |
          cd modules/agent-warden-2/tests/render
          terraform init -backend=false
          terraform apply -auto-approve
          terraform output -json guardrail_matrix > /tmp/gm.json
          python3 ../evaluate.py /tmp/gm.json

  validate:
    name: Validate Modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range. Without the floor, `required_version
        # >= 1.9.0` is an untested claim - and 1.9.x evaluates both operands of
        # `||`/`&&`, so a validation that works on 1.12 can crash there.
        terraform: ["1.9.8", "latest"]
        module: [agent-warden, agent-warden-2, appconfig, aurora, wafv2, dynamodb, ci-oidc, aws-backup, gitlab-runner, gitlab-runner-fargate, bastion-isolated, ebs, ecr, ecs-orchestrator, ecs-service-connect, efs, eks, lb, asg-group, route53, sm, sns, sqs, tfe-hub]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.terraform }}

      - name: Terraform Init & Validate
        run: |
          cd modules/${{ matrix.module }}
          terraform init -backend=false
          terraform validate

      - name: Terraform Test
        run: |
          cd modules/${{ matrix.module }}
          if ls tests/*.tftest.hcl >/dev/null 2>&1; then
            terraform test
          else
            echo "No tests for ${{ matrix.module }}, skipping."
          fi

      - name: Setup TFLint
        if: matrix.terraform == 'latest'
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.55.0

      - name: TFLint
        if: matrix.terraform == 'latest'
        run: |
          cd modules/${{ matrix.module }}
          tflint --init
          tflint

  validate-examples:
    name: Validate Examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Includes modules/*/examples/** - an in-module quick-start that cannot
      # plan is the worst possible first impression, and nothing caught it before.
      # Failures are ACCUMULATED, not fatal on the first one. With `set -e` the
      # loop aborted on the alphabetically-first directory, so a single unrelated
      # broken example silently prevented every other example from being
      # validated at all - which is how four gitlab-runner examples went
      # unchecked in CI while this step reported green.
      - name: Terraform Init & Validate (every example dir)
        run: |
          set -uo pipefail
          failed=()
          for dir in $(find examples modules/*/examples -type f -name '*.tf' -exec dirname {} \; 2>/dev/null | sort -u); do
            echo "::group::validate $dir"
            if terraform -chdir="$dir" init -backend=false && terraform -chdir="$dir" validate; then
              echo "OK: $dir"
            else
              echo "::error::validate failed: $dir"
              failed+=("$dir")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::${#failed[@]} example directory/ies failed to validate:"
            printf '  - %s\n' "${failed[@]}"
            exit 1
          fi
          echo "All example directories validated."

  # Real apply against a live AWS account. Gated: only runs when the repo
  # variable RUN_INTEGRATION_TESTS == 'true' and an OIDC role is configured.
  # This is what proves AWS *accepts* the generated resources (not just wiring).
  integration-apply:
    name: Integration Apply (gated)
    runs-on: ubuntu-latest
    if: vars.RUN_INTEGRATION_TESTS == 'true'
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        example: [lb, lb-network]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INTEGRATION_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Apply then destroy
        working-directory: examples/${{ matrix.example }}
        run: |
          set -e
          terraform init
          terraform apply -auto-approve
          terraform destroy -auto-approve

  # The gitlab-runner module's highest-value test: an actual apply. Its worst
  # defects (a readiness gate in the wrong TOML table, alarms on unpublished
  # metrics, a launch-template/instance conflict) are all invisible to a plan.
  # Gated behind RUN_INTEGRATION_TESTS + a runner token in secrets.
  runner-integration:
    name: GitLab Runner Integration Apply (gated)
    runs-on: ubuntu-latest
    if: vars.RUN_RUNNER_INTEGRATION == 'true'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_INTEGRATION_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Apply, verify the runner registers, destroy
        working-directory: modules/gitlab-runner/examples/simple
        env:
          TF_VAR_runner_token: ${{ secrets.GITLAB_RUNNER_TOKEN }}
          TF_VAR_vpc_id: ${{ vars.INTEGRATION_VPC_ID }}
          TF_VAR_private_subnet_ids: ${{ vars.INTEGRATION_SUBNET_IDS }}
        run: |
          set -euo pipefail
          trap 'terraform destroy -auto-approve || true' EXIT
          terraform init
          terraform apply -auto-approve

          ASG=$(terraform output -raw worker_asg_name)
          MGR=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=ci-manager Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          echo "manager: $MGR"

          # The bootstrap publishes BootstrapFailure=0 and then a RunnerHealthy
          # heartbeat every 60s. Wait for the heartbeat - that is the real
          # "the runner is up and talking to GitLab" signal.
          for i in $(seq 1 30); do
            V=$(aws cloudwatch get-metric-statistics \
                  --namespace "GitLabRunner/ci" --metric-name RunnerHealthy \
                  --dimensions Name=Fleet,Value=ci \
                  --start-time "$(date -u -d '15 minutes ago' +%Y-%m-%dT%H:%M:%SZ)" \
                  --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  --period 60 --statistics Maximum \
                  --query 'Datapoints[-1].Maximum' --output text 2>/dev/null || echo None)
            [ "$V" = "1.0" ] && { echo "runner healthy after $((i*30))s"; break; }
            echo "waiting for runner heartbeat ($i/30)... last=$V"
            sleep 30
          done
          [ "${V:-None}" = "1.0" ] || {
            echo "::error::runner never reported healthy - dumping bootstrap log"
            aws ssm send-command --instance-ids "$MGR" \
              --document-name AWS-RunShellScript \
              --parameters 'commands=["cat /var/log/runner-bootstrap.log"]' \
              --query 'Command.CommandId' --output text || true
            exit 1
          }

          # Prove the fleet can actually launch a worker.
          aws autoscaling set-desired-capacity --auto-scaling-group-name "$ASG" --desired-capacity 1
          aws ec2 wait instance-running --filters "Name=tag:aws:autoscaling:groupName,Values=$ASG"
          echo "worker launched"

