name: install-gitlab-runner
description: >-
  Installs gitlab-runner and fleeting-plugin-aws into the image, so a manager
  instance can boot in a VPC with no route to the public internet. Both are
  fetched from GitLab's public infrastructure, which means this component must
  run where that is reachable - a build subnet with egress, or an internal
  mirror. That is the whole point: the fetch happens once here, at build time,
  instead of on every manager boot in an isolated estate.
schemaVersion: 1.0

parameters:
  - RunnerVersion:
      type: string
      description: >-
        Exact gitlab-runner package version, e.g. 17.5.3-1. Must be a version the
        repository still carries. Never leave this as latest in a governed
        estate: the image you audit and the image you rebuild would differ.
      default: ""
  - PluginVersion:
      type: string
      description: >-
        fleeting-plugin-aws version, e.g. 1.0.0. Empty installs whatever
        `gitlab-runner fleeting install` resolves, which is not reproducible.
      default: ""
  - RepoScriptUrl:
      type: string
      description: >-
        Package repository setup script. Point this at an internal mirror where
        one exists.
      default: https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.rpm.sh
  - RepoScriptSha256:
      type: string
      description: >-
        SHA-256 of RepoScriptUrl's contents. Empty means the script runs as root
        unverified, which is curl-pipe-bash with extra steps.
      default: ""

phases:
  - name: build
    steps:
      - name: RequireVersionPin
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              # Quoted: an unquoted value containing a space gave
              # "[: binary operator expected", exit 2, and a false condition -
              # so the pin check silently passed.
              VERSION='{{ RunnerVersion }}'
              if [ -z "$VERSION" ]; then
                echo "FATAL: RunnerVersion is empty. An unpinned runner version makes this image non-reproducible." >&2
                exit 1
              fi

      - name: FetchRepoScript
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              # mktemp -d under 0700, not a fixed /tmp path: verify-then-execute
              # spans two steps, and working_directory defaults to /tmp.
              #
              # --max-time matters here specifically: in a VPC with no internet
              # route this fetch is exactly the hang the README warns about, and
              # without a timeout it burns the whole build window.
              WORKDIR="$(mktemp -d)"
              chmod 0700 "$WORKDIR"
              REPO_SCRIPT="$WORKDIR/gl-runner-repo.sh"
              echo "$REPO_SCRIPT" > /run/gl-repo-script-path
              # Single-quoted so command substitution cannot happen inside the URL.
              curl -fsSL --connect-timeout 10 --max-time 120 --retry 5 --retry-delay 3 \
                '{{ RepoScriptUrl }}' -o "$REPO_SCRIPT"
              test -s "$REPO_SCRIPT"

      - name: VerifyRepoScript
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              # Fails closed. This used to warn and exit 0, so the default
              # path ran a fetched script as root unverified while the README
              # advertised "digest-verified repo script" as a fact.
              EXPECTED='{{ RepoScriptSha256 }}'
              if [ -z "$EXPECTED" ]; then
                echo "FATAL: RepoScriptSha256 is required. This script runs as root; without a digest this is curl-pipe-bash with extra steps." >&2
                exit 1
              fi
              echo "$EXPECTED  $REPO_SCRIPT" | sha256sum -c -

      - name: AddRepository
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              REPO_SCRIPT="$(cat /run/gl-repo-script-path)"
              bash "$REPO_SCRIPT"
              rm -rf "$(dirname "$REPO_SCRIPT")" /run/gl-repo-script-path

      - name: InstallRunner
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              dnf install -y "gitlab-runner-{{ RunnerVersion }}"

      - name: InstallFleetingPlugin
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              # `fleeting install` reads the plugin reference from config.toml,
              # which does not exist yet at build time, so install by name.
              if [ -n "{{ PluginVersion }}" ]; then
                gitlab-runner fleeting install --upgrade \
                  "gitlab.com/gitlab-org/fleeting/plugins/aws:{{ PluginVersion }}"
              else
                echo "WARNING: PluginVersion is empty; installing whatever resolves now." >&2
                gitlab-runner fleeting install --upgrade \
                  gitlab.com/gitlab-org/fleeting/plugins/aws
              fi

      - name: DisableRunnerUntilConfigured
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              # The image ships no config.toml and no registration token. Leaving
              # the unit enabled means every instance from this AMI starts a
              # runner that crash-loops on a missing config, filling the journal
              # and confusing the first person to look.
              systemctl disable gitlab-runner || true
              rm -f /etc/gitlab-runner/config.toml

      - name: RemoveBuildTimeSecrets
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              # Anything the build fetched with credentials, plus the package
              # manager caches that record where it came from.
              rm -rf /root/.gitlab-runner /home/*/.gitlab-runner
              dnf clean all
              rm -rf /var/cache/dnf

  - name: test
    steps:
      - name: RunnerBinaryPresent
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              command -v gitlab-runner >/dev/null

      - name: RunnerVersionMatchesRequest
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              # The package version carries a release suffix, so compare the
              # upstream part rather than requiring an exact string match.
              WANT="$(echo '{{ RunnerVersion }}' | cut -d- -f1)"
              GOT="$(gitlab-runner --version | awk '/^Version:/ {print $2}')"
              echo "want=$WANT got=$GOT"
              case "$GOT" in
                "$WANT"*) : ;;
                *) echo "FATAL: installed runner $GOT does not match requested $WANT" >&2; exit 1 ;;
              esac

      - name: FleetingPluginPresentAndExecutable
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              # `fleeting install` places the binary under a plugin directory
              # rather than on $PATH, so checking $PATH would verify nothing.
              FOUND=""
              for c in \
                /etc/gitlab-runner/plugins/fleeting-plugin-aws \
                /root/.config/fleeting/plugins/fleeting-plugin-aws \
                /root/.config/gitlab-runner/plugins/fleeting-plugin-aws
              do
                # -f as well as -x: [ -x <dir> ] is true for a directory.
                if [ -f "$c" ] && [ -x "$c" ]; then FOUND="$c"; break; fi
              done
              if [ -z "$FOUND" ]; then
                FOUND="$(command -v fleeting-plugin-aws 2>/dev/null || true)"
              fi
              if [ -z "$FOUND" ]; then
                echo "FATAL: fleeting-plugin-aws not found in the image. A manager built from this AMI cannot scale a fleet." >&2
                exit 1
              fi
              echo "plugin at $FOUND"

      - name: NoRunnerTokenBakedIn
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              # A registration token in an AMI is a credential distributed to
              # everyone who can launch it.
              # No pipeline. The old `grep -rl ... | head -1 | grep -q .` form
              # took SIGPIPE on grep once head exited, and pipefail then made
              # the pipeline status 141 - so the FATAL branch was SKIPPED. The
              # more token material the image contained, the more reliably the
              # test passed.
              #
              # /var added: AWSTOE's logs and cloud-init's user-data copy live
              # there, and both can carry a token.
              if grep -rIlq 'glrt-' /etc /var /root /home /opt 2>/dev/null; then
                echo "FATAL: a glrt- runner token is present in this image." >&2
                grep -rIl 'glrt-' /etc /var /root /home /opt 2>/dev/null | head -20 >&2 || true
                exit 1
              fi

      - name: RunnerServiceNotEnabled
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              if systemctl is-enabled gitlab-runner 2>/dev/null | grep -q '^enabled$'; then
                echo "FATAL: gitlab-runner is enabled but the image carries no config; it will crash-loop on boot." >&2
                exit 1
              fi
